name: sudachi_dart
description: "Flutter FFI plugin for Japanese morphological analysis using Sudachi. Tokenizes Japanese text into morphemes with POS tags, readings, and dictionary forms."
version: 0.0.2
repository: https://github.com/Flares243/sudachi_dart
homepage: https://github.com/Flares243/sudachi_dart

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.2.0
  hooks: ^2.1.0
  logging: ^1.3.0

dev_dependencies:
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  test: ^1.31.2
