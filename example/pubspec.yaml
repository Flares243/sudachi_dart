name: sudachi_dart_example
description: "Demonstrates how to use the sudachi_dart package."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  sudachi_dart:
    path: ../

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sudachi/sudachi.json
